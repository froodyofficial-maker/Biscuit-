# Cloudflare Workers config for Biscuit (free plan). Deployed by .github/workflows/deploy.yml.
name = "biscuit"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The app itself: served as static files.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/uploads/*"]

# All accounts, servers, messages and uploads live in one Durable Object with SQLite storage.
[[durable_objects.bindings]]
name = "HUB"
class_name = "BiscuitHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BiscuitHub"]
