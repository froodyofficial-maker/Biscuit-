<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biscuit</title>
  <link rel="icon" href="public/assets/icon.svg" type="image/svg+xml">
  <!-- GitHub Pages serves the repo root; the app lives in public/. Keep any #invite link. -->
  <!-- If Biscuit's shared server is online (server.json, written by the deploy workflow), go there; otherwise open the app here. -->
  <script>
    fetch('server.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        const ok = j && /^https:\/\/[^\s"'<>]+$/.test(j.url || '');
        location.replace(ok ? j.url.replace(/\/$/, '') + '/' + location.hash : 'public/' + location.hash);
      })
      .catch(() => location.replace('public/' + location.hash));
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=public/"></noscript>
  <style>body{margin:0;height:100vh;display:grid;place-items:center;background:#1e1f22;color:#dbdee1;font:600 16px system-ui,sans-serif}a{color:#e8a33d}</style>
</head>
<body><p>🍪 Opening <a href="public/">Biscuit</a>…</p></body>
</html>
