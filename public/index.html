<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biscuit</title>
  <meta name="description" content="Biscuit: chat with friends, build your profile, every perk free.">
  <meta name="theme-color" content="#1e1f22">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot"><div class="boot-logo">🍪</div><div class="boot-text">Baking Biscuit…</div></div>

  <!-- login / register -->
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span class="auth-logo">🍪</span><span>Biscuit</span></div>
      <h1 id="auth-title">Welcome back!</h1>
      <p id="auth-sub" class="muted">We're so excited to see you again!</p>
      <form id="auth-form" autocomplete="on">
        <label class="field" id="f-display" hidden><span>Display name</span><input name="displayName" maxlength="32" autocomplete="nickname"></label>
        <label class="field"><span>Username <b class="req">*</b></span><input name="username" required maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <label class="field"><span>Password <b class="req">*</b></span><input name="password" type="password" required autocomplete="current-password"></label>
        <p id="auth-error" class="form-error" hidden></p>
        <button class="btn primary block" type="submit" id="auth-submit">Log In</button>
      </form>
      <p class="muted small"><span id="auth-switch-text">Need an account?</span> <a href="#" id="auth-switch">Register</a></p>
      <div id="auth-local" class="auth-local" hidden></div>
      <div class="auth-perks">
        <div>🎞️ Animated avatars &amp; banners</div><div>🎨 Profile themes &amp; effects</div>
        <div>😀 Custom emoji everywhere</div><div>📎 100 MB uploads</div>
        <div class="golden-tag">✨ Golden Biscuit: every perk free</div>
      </div>
    </div>
  </section>

  <!-- the app -->
  <div id="shell" class="shell" hidden>
    <nav id="rail" class="rail" aria-label="Servers"></nav>
    <aside id="sidebar" class="sidebar">
      <header id="sidebar-head" class="sidebar-head"></header>
      <div id="sidebar-body" class="sidebar-body"></div>
      <div id="userpanel" class="userpanel"></div>
    </aside>
    <main id="main" class="main">
      <header id="chat-head" class="chat-head"></header>
      <div class="chat-wrap">
        <section id="view" class="view"></section>
        <aside id="members" class="members"></aside>
      </div>
    </main>
    <div id="scrim" class="scrim" data-act="close-drawers"></div>
  </div>

  <div id="layer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="dropzone" class="dropzone" hidden><div class="dropzone-card"><div class="dz-icon">📎</div><b>Drop to upload</b><span id="dz-target"></span></div></div>

  <script src="js/core.js"></script>
  <script src="js/emoji-data.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/gif.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
